<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine Surprise 💕</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    height: 100vh;
    background: #ff8fab;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
  }

  .card {
    background: #c75c75;
    padding: 26px;
    border-radius: 22px;
    text-align: center;
    width: 90%;
    max-width: 420px;
    color: white;
    position: relative;
    z-index: 2;
  }

  .gif {
    width: 150px;
    margin-bottom: 12px;
    border-radius: 14px;
  }

  h1 {
    margin: 8px 0 10px;
    font-size: 22px;
  }

  .buttons {
    position: relative;
    height: 80px;
    margin-top: 10px;
  }

  button {
    font-size: 16px;
    padding: 10px 22px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    white-space: nowrap;

    /* 🔒 LOCK SIZE */
    width: 110px;
    height: 42px;
  }

  .yes {
    background: #28a745;
    color: white;
    position: absolute;
    left: 10%;
    top: 18px;
  }

  .no {
    background: #dc3545;
    color: white;
    position: absolute;
    right: 10%;
    top: 18px;
  }
</style>
</head>

<body>

<div class="card">
  <img class="gif"
       src="https://gifdb.com/images/high/animated-bear-is-in-love-obdfb0txoitfinz6.webp"
       alt="Cute Teddy">

  <h1>Will you be my Valentine? 💝</h1>
  <h1>MUMMY</h1>

  <div class="buttons">
    <button class="yes" onclick="yesClick()">YES 💖</button>
    <button class="no" id="noBtn">NO 😅</button>
  </div>
</div>

<script>
  const noBtn = document.getElementById("noBtn");
  let released = false;

  function moveNoButton() {
    if (!released) {
      // 🔥 RELEASE to viewport CLEANLY
      noBtn.style.position = "fixed";
      noBtn.style.left = "auto";
      noBtn.style.right = "auto";
      released = true;
    }

    const maxX = window.innerWidth - noBtn.offsetWidth;
    const maxY = window.innerHeight - noBtn.offsetHeight;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.left = `${x}px`;
    noBtn.style.top  = `${y}px`;
  }

  noBtn.addEventListener("click", moveNoButton);

  function yesClick() {
    document.body.innerHTML = `
      <div style="
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        flex-direction:column;
        background:#ff8fab;
        font-family:'Segoe UI';
        text-align:center;
        color:white;
      ">
        <img src="https://media.tenor.com/mfC-cc_TL_sAAAAM/thank-you.gif"
             width="220" style="border-radius:16px;">
        <h1>I knew it Mummy 😍</h1>
        <h1>You have chosen the best option mummylu</h1>
        <p>Advance Happy Valentine’s Day ❤️</p>
      </div>
    `;
  }
</script>

</body>
</html>
